{% extends "layout.html" %}

{% block title %}
    Add
{% endblock %}

{% block main %}
    <h1>Add Info</h1>
    <form action="/add" method="post">
        <div class="mb-3">
            <input autocomplete="off" autofocus class="form-control mx-auto w-auto" id="name" name="name" placeholder="name" type="text">
        </div>
        <div class="mb-3">
            <input autocomplete="off" autofocus class="form-control mx-auto w-auto" id="city" name="city" placeholder="city" type="text">
        </div>
        <div class="mb-3">
            <input autocomplete="off" autofocus class="form-control mx-auto w-auto" id="number" name="number" placeholder="number" type="number">
        </div>
        <button class="btn btn-primary" type="submit">Add Info</button>
    </form>
{% endblock %}
